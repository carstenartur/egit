name: JDT template registry integration validation
on:
  push:
    branches: [qa/template-registry-20260922]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-jdt-template-registry-api
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain JGit p2 snapshot using the upstream EGit CI procedure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = ET.parse('pom.xml').getroot().findtext('m:version', namespaces=ns)
          assert version and version.endswith('-SNAPSHOT'), version
          base = ('https://repo.eclipse.org/repository/jgit-maven2-snapshots/'
                  'org/eclipse/jgit/org.eclipse.jgit.repository/' + version)
          with urllib.request.urlopen(base + '/maven-metadata.xml', timeout=90) as response:
              metadata = ET.fromstring(response.read())
          versions = [entry.findtext('value') for entry in metadata.findall('.//snapshotVersion')
                      if entry.findtext('extension') == 'zip' and not entry.findtext('classifier')]
          assert versions, ET.tostring(metadata, encoding='unicode')
          url = base + '/org.eclipse.jgit.repository-' + versions[-1] + '.zip'
          print('JGit p2 snapshot:', url)
          root = Path(os.environ['RUNNER_TEMP']) / 'jgit-p2'
          root.mkdir()
          archive = root.parent / 'jgit-p2.zip'
          urllib.request.urlretrieve(url, archive)
          with zipfile.ZipFile(archive) as z:
              z.extractall(root)
          assert any((root / name).is_file() for name in ['content.jar', 'content.xml', 'content.xml.xz']), list(root.iterdir())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('JGIT_SITE=' + root.as_uri() + '\n')
          PY
      - name: Build and run the template registry regression tests
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git diff --check HEAD^
          xvfb-run -a mvn -B -ntp -Djgit-site="$JGIT_SITE" -Dtest=StartEventListenerTest -DfailIfNoTests=false verify 2>&1 | tee "$RUNNER_TEMP/registry-tests.log"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-registry-validation
          path: |
            ${{ runner.temp }}/registry-tests.log
            **/target/surefire-reports/**
            **/target/work/data/.metadata/.log
          include-hidden-files: true
          if-no-files-found: warn
